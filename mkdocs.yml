site_name: AI for Physical Sciences — Essential
site_description: Fall 2026 course website for Artificial Intelligence for Physical Sciences
site_url: https://ytchoutw.github.io/PHYS-5910-0/
repo_url: https://github.com/ytchoutw/PHYS-5910-0
repo_name: ytchoutw/PHYS-5910-0

theme:
  name: material
  language: en
  logo: assets/nthu-round-seal.svg
  favicon: assets/nthu-round-seal.svg
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Welcome: index.md
  - Prerequisites: prerequisites.md
  - Syllabus: syllabus.md
  - Resources: resources.md

hooks:
  - hooks/last_updated.py

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

copyright: 'Copyright &copy; 2026 Yuan-Tang Chou · Course content licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>'
